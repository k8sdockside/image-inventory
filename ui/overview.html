<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Image inventory</title>
        <link rel="stylesheet" href="image-inventory.css" />
        <!-- The bridge to the app. Served by K8s Dockside itself, always at this path. -->
        <script src="/plugin-ui/_sdk/k8sdockside.js"></script>
    </head>
    <body class="page page-overview">
        <p id="error" class="banner error" role="alert" hidden></p>

        <!-- The verdict, and where the images come from. -->
        <section id="hero" class="ov-hero">
            <div class="ov-loading">
                <span class="pulse"></span>
                <span>Reading what runs in this cluster…</span>
            </div>
        </section>

        <section id="stats" class="stats" hidden></section>

        <!-- Images that are failing, not ready, drifting or floating. -->
        <section id="attention" class="card" hidden></section>

        <div id="columns" class="ov-columns" hidden>
            <section id="top" class="card"></section>
            <section id="users" class="card"></section>
        </div>

        <!-- The plugin's Prometheus charts, when the cluster has a Prometheus. -->
        <section id="history" class="ov-history" hidden></section>

        <footer id="foot" class="ov-foot" hidden></footer>

        <!-- A classic script, not type="module": a sandboxed frame has an
             opaque origin, so a module would be a cross-origin load.
             Built from src/pages/overview.ts. -->
        <script src="overview.js"></script>
    </body>
</html>
